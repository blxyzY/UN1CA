name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'QPR2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        target: [a23]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh

      - name: Upload patch reject files (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects-${{ matrix.target }}-${{ github.run_id }}
          path: |
            out/target/${{ matrix.target }}/apktool/**/*.rej
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload to GoFile
        run: |
          ZIP_FILE=$(find out -type f -name "*sign_FZI1.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in out/ directory!"
            exit 1
          fi

          sleep 2

          echo "Found file: $ZIP_FILE"

          echo "MD5:"
          md5sum "$ZIP_FILE"

          echo "SHA256:"
          sha256sum "$ZIP_FILE"

          echo "Starting upload to GoFile..."
          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" "https://upload-eu-par.gofile.io/uploadFile")

          echo "Uploaded successfully! Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'

      - name: Build flashable zip
        run: |
          TARGET_FILES_ZIP="$(find "$OUT_DIR" -maxdepth 1 -name "${{ matrix.target }}_*-target_files.zip" | head -n 1)"
          if [ -z "$TARGET_FILES_ZIP" ] || [ ! -f "$TARGET_FILES_ZIP" ]; then
            echo "Error: target-files zip not found in $OUT_DIR" >&2
            exit 1
          fi
          ./scripts/build_flashable_zip.sh "$TARGET_FILES_ZIP"

      - name: Upload flashable zip to Pixeldrain
        if: github.event_name != 'pull_request'
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          chmod +x ./scripts/upload_pixeldrain.sh
          FLASHABLE_ZIP="$(find "$OUT_DIR" -maxdepth 1 -name "UN1CA_*.zip" | head -n 1)"
          if [ -z "$FLASHABLE_ZIP" ] || [ ! -f "$FLASHABLE_ZIP" ]; then
            echo "Error: Flashable zip not found in $OUT_DIR" >&2
            exit 1
          fi
          echo "Uploading $(basename "$FLASHABLE_ZIP") to Pixeldrain..."
          LINK="$(./scripts/upload_pixeldrain.sh "$FLASHABLE_ZIP" | head -n 1)"
          if [ -z "$LINK" ] || [ "$LINK" = "null" ]; then
            echo "Error: Failed to obtain Pixeldrain download link!" >&2
            exit 1
          fi
          echo "============================================="
          echo "Pixeldrain Download Link: $LINK"
          echo "============================================="
          SHA256="$(sha256sum "$FLASHABLE_ZIP" | cut -d ' ' -f 1)"
          MD5="$(md5sum "$FLASHABLE_ZIP" | cut -d ' ' -f 1)"
          {
            echo "PIXELDRAIN_LINK=$LINK"
            echo "ZIP_SHA256=$SHA256"
            echo "ZIP_MD5=$MD5"
            echo "ZIP_NAME=$(basename "$FLASHABLE_ZIP")"
          } >> "$GITHUB_ENV"
          {
            echo "### UN1CA for ${{ matrix.target }}"
            echo "- **Download**: [$LINK]($LINK)"
            echo "- **File**: \`$(basename "$FLASHABLE_ZIP")\`"
            echo "- **MD5**: \`$MD5\`"
            echo "- **SHA256**: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.ROM_VERSION }}
          name: UN1CA ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.ROM_VERSION }}
          body: |
            ## Download
            ### ${{ matrix.target }}
            - [Pixeldrain](${{ env.PIXELDRAIN_LINK }})
