name: Build

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog'
        required: false
        default: ''
        type: string
      security_patch:
        description: 'Security patch date (YYYY-MM-DD)'
        required: true
        type: string

  pull_request:

  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      STATIC_REPO: qwertswa/static_resources
      MANIFEST_BRANCH: a23
      PART_SIZE: 1610612736
      TF_TAG: target-files
      TF_KEEP: 3
      INC_SOURCES: 2
      # Gambar banner untuk release notes (commit file ini ke repo; kosongkan/hapus file untuk menonaktifkan)
      RELEASE_IMAGE: .github/release-banner.png

    strategy:
      fail-fast: false
      matrix:
        target: [a23, a23xq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          echo -n "${{ secrets.OTA_KEY_PK8 }}" | base64 --decode > security/unica_ota.pk8
          echo -n "${{ secrets.OTA_KEY_PEM }}" | base64 --decode > security/unica_ota.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh

      # Pembuatan zip hanya butuh target_files zip, tools, dan key. Firmware stock, work_dir, dsb.
      # sudah tidak dipakai lagi, dan menghapusnya membebaskan puluhan GB supaya 7z/signapk
      # (yang butuh beberapa salinan zip 5 GB sekaligus) tidak kehabisan disk.
      - name: Free disk space before packaging
        run: |
          set -euo pipefail
          TARGET_FILES_ZIP="$(find "$OUT_DIR" -maxdepth 1 -name "${{ matrix.target }}_*-target_files.zip" | head -n 1)"
          if [ -z "$TARGET_FILES_ZIP" ] || [ ! -f "$TARGET_FILES_ZIP" ]; then
            echo "Error: target-files zip not found in $OUT_DIR" >&2
            exit 1
          fi
          df -h / | tail -n 1
          rm -rf "${FW_DIR:?}" "${ODIN_DIR:?}" "${WORK_DIR:?}" "${APKTOOL_DIR:?}" "${TMP_DIR:?}"
          df -h / | tail -n 1

      - name: Build flashable zip
        run: |
          TARGET_FILES_ZIP="$(find "$OUT_DIR" -maxdepth 1 -name "${{ matrix.target }}_*-target_files.zip" | head -n 1)"
          if [ -z "$TARGET_FILES_ZIP" ] || [ ! -f "$TARGET_FILES_ZIP" ]; then
            echo "Error: target-files zip not found in $OUT_DIR" >&2
            exit 1
          fi
          ./scripts/build_flashable_zip.sh "$TARGET_FILES_ZIP"

      # gh ikut terhapus oleh step "Free disk space", jadi dipasang ulang di sini
      # (dipindah ke atas karena sekarang dipakai untuk mengambil target_files lama).
      - name: Install GitHub CLI
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            VER=2.63.2
            curl -fsSL "https://github.com/cli/cli/releases/download/v${VER}/gh_${VER}_linux_amd64.tar.gz" \
              | sudo tar -xz -C /usr/local --strip-components=1
          fi
          gh --version

      # Buat zip INCREMENTAL dari target_files rilis-rilis sebelumnya (disimpan di tag $TF_TAG).
      # Kalau belum ada target_files lama (rilis pertama setelah perubahan ini), step ini dilewati
      # dan hanya zip full yang dirilis.
      - name: Build incremental zips
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.STATIC_RESOURCES_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_FILES_ZIP="$(find "$OUT_DIR" -maxdepth 1 -name "${{ matrix.target }}_*-target_files.zip" | head -n 1)"
          CUR_NAME="$(basename "$TARGET_FILES_ZIP")"
          PREV_DIR="$RUNNER_TEMP/prev"
          mkdir -p "$PREV_DIR"

          echo "Looking for release '$TF_TAG' in $STATIC_REPO"
          if ! VIEW_OUT="$(gh release view "$TF_TAG" --repo "$STATIC_REPO" --json tagName -q .tagName 2>&1)"; then
            echo "::warning::gh release view '$TF_TAG' failed: $VIEW_OUT"
            echo "Releases visible with this token:"
            gh release list --repo "$STATIC_REPO" --limit 20 || true
            echo "Skipping incremental zips"
            exit 0
          fi
          echo "Found release: $VIEW_OUT"

          # "<createdAt> <asset name>" -> newest first -> strip the .NN part suffix -> unique base names
          gh release view "$TF_TAG" --repo "$STATIC_REPO" --json assets \
            -q '.assets[] | "\(.createdAt) \(.name)"' \
            | grep -E " ${{ matrix.target }}_.*-target_files\.zip\.[0-9]{2}$" \
            | sort -r \
            | awk '{ sub(/\.[0-9][0-9]$/, "", $2); if (!seen[$2]++) print $2 }' \
            | grep -vxF "$CUR_NAME" \
            | head -n "$INC_SOURCES" > "$RUNNER_TEMP/bases.txt" || true

          if [ ! -s "$RUNNER_TEMP/bases.txt" ]; then
            echo "No previous target-files for ${{ matrix.target }}, skipping incremental zips"
            exit 0
          fi

          while IFS= read -r base; do
            echo "::group::Incremental from $base"
            gh release download "$TF_TAG" --repo "$STATIC_REPO" --pattern "$base.[0-9][0-9]" --dir "$PREV_DIR"
            cat "$PREV_DIR/$base".[0-9][0-9] > "$PREV_DIR/$base"
            rm -f "$PREV_DIR/$base".[0-9][0-9]
            if ! ./scripts/build_flashable_zip.sh -i "$PREV_DIR/$base" "$TARGET_FILES_ZIP"; then
              echo "::warning::Could not build incremental zip from $base"
            fi
            rm -f "$PREV_DIR/$base"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/bases.txt"

      # Zip yang lebih kecil dari PART_SIZE (mis. zip INCREMENTAL) TIDAK dipecah dan diunggah dengan
      # nama aslinya, sama seperti UN1CA resmi. Hanya zip yang lebih besar dipecah jadi .00, .01, ...
      # Baris release_list.txt: nama|ukuran|sha256|incremental|jumlah_bagian (0 = tidak dipecah)
      - name: Prepare release assets (split flashable zips)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          LIST="$OUT_DIR/release_list.txt"
          : > "$LIST"

          shopt -s nullglob
          ZIPS=("$OUT_DIR"/UN1CA_*.zip)
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "Error: Flashable zip not found in $OUT_DIR" >&2
            exit 1
          fi

          for ZIP in "${ZIPS[@]}"; do
            ZIP_NAME="$(basename "$ZIP")"
            ZIP_SIZE="$(stat -c %s "$ZIP")"
            ZIP_SHA256="$(sha256sum "$ZIP" | cut -d ' ' -f 1)"
            BUILD_INFO="$(unzip -p "$ZIP" build_info.txt)"
            # 0 for full zips, source build timestamp for incremental zips
            ZIP_INC="$(grep '^incremental=' <<< "$BUILD_INFO" | cut -d '=' -f 2 -s || true)"
            ZIP_TS="$(grep '^timestamp=' <<< "$BUILD_INFO" | cut -d '=' -f 2 -s || true)"

            # Updater app: incremental=0 -> shown as a FULL rom; incremental=N -> shown only on the
            # build whose timestamp is N. So the value in build_info.txt must match the file name.
            NAME_INC="$(sed -n 's/.*-INCREMENTAL_\([0-9][0-9]*\)-sign\.zip$/\1/p' <<< "$ZIP_NAME")"
            if [ -n "$NAME_INC" ] && [ "${ZIP_INC:-0}" != "$NAME_INC" ]; then
              echo "Error: $ZIP_NAME is named INCREMENTAL_$NAME_INC but build_info.txt says incremental='${ZIP_INC:-}'" >&2
              exit 1
            fi
            if [ -z "$NAME_INC" ] && [ "${ZIP_INC:-0}" != "0" ]; then
              echo "Error: $ZIP_NAME has no INCREMENTAL in its name but build_info.txt says incremental=$ZIP_INC" >&2
              exit 1
            fi
            if [ "${ZIP_INC:-0}" != "0" ] && [ "$ZIP_INC" = "$ZIP_TS" ]; then
              echo "::warning::$ZIP_NAME: incremental source timestamp equals its own target timestamp ($ZIP_TS)"
            fi

            if [ "$ZIP_SIZE" -gt "$PART_SIZE" ]; then
              # <zip>.00, <zip>.01, ... (same naming as official UN1CA)
              split -b "$PART_SIZE" -d -a 2 "$ZIP" "$ZIP."
              ZIP_PARTS="$(find "$OUT_DIR" -maxdepth 1 -name "${ZIP_NAME}.[0-9][0-9]" | wc -l)"
              EXPECTED_PARTS=$(( (ZIP_SIZE + PART_SIZE - 1) / PART_SIZE ))
              if [ "$ZIP_PARTS" -ne "$EXPECTED_PARTS" ]; then
                echo "Error: $ZIP_NAME expected $EXPECTED_PARTS parts, found $ZIP_PARTS" >&2
                exit 1
              fi
            else
              ZIP_PARTS=0
            fi
            echo "$ZIP_SHA256  $ZIP_NAME" > "$ZIP.sha256"

            echo "$ZIP_NAME|$ZIP_SIZE|$ZIP_SHA256|${ZIP_INC:-0}|$ZIP_PARTS" >> "$LIST"
            echo "$ZIP_NAME: $ZIP_SIZE bytes, incremental=${ZIP_INC:-0}, parts=$ZIP_PARTS (0 = single file)"
          done

          echo "RELEASE_LIST=$LIST" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${ROM_VERSION%%-*}" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release (static_resources)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.STATIC_RESOURCES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"

          if ! gh release view "$TAG" --repo "$STATIC_REPO" >/dev/null 2>&1; then
            TARGET=()
            if gh api "repos/$STATIC_REPO/branches/$MANIFEST_BRANCH" >/dev/null 2>&1; then
              TARGET=(--target "$MANIFEST_BRANCH")
            fi
            NOTES=""
            if [ -f "$RELEASE_IMAGE" ]; then
              NOTES="![UN1CA](https://github.com/$STATIC_REPO/releases/download/$TAG/$(basename "$RELEASE_IMAGE"))"$'\n\n'
            else
              echo "::warning::$RELEASE_IMAGE not found, release will have no image"
            fi
            NOTES+="Large ROM zips are split into parts (.00, .01, ...). The UN1CA Updates app downloads and joins them automatically.
          Zips with INCREMENTAL in the name are single files and only update from the build whose timestamp is in the file name.

          To install a split zip manually, join the parts first:

              cat UN1CA_<version>_<device>-sign.zip.* > UN1CA_<version>_<device>-sign.zip

          The SHA-256 of every zip is in the matching .sha256 file."
            gh release create "$TAG" --repo "$STATIC_REPO" "${TARGET[@]}" \
              --title "UN1CA $TAG" --notes "$NOTES" \
              || gh release view "$TAG" --repo "$STATIC_REPO" >/dev/null
          fi

          upload() {
            local f="$1" ok=0 attempt
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --repo "$STATIC_REPO" --clobber; then
                ok=1
                break
              fi
              echo "Upload of $(basename "$f") failed (attempt $attempt/3)" >&2
              sleep 15
            done
            if [ "$ok" -ne 1 ]; then
              echo "Error: could not upload $(basename "$f")" >&2
              exit 1
            fi
          }

          # names of the assets that make up one zip: the zip itself, or its .NN parts
          asset_names() {
            local name="$1" parts="$2" i
            if [ "$parts" -eq 0 ]; then
              printf '%s\n' "$name"
            else
              for i in $(seq 0 $((parts - 1))); do
                printf '%s.%02d\n' "$name" "$i"
              done
            fi
          }

          if [ -f "$RELEASE_IMAGE" ]; then
            upload "$RELEASE_IMAGE"
          fi

          while IFS='|' read -r ZIP_NAME ZIP_SIZE ZIP_SHA256 ZIP_INC ZIP_PARTS; do
            while IFS= read -r a; do
              upload "$OUT_DIR/$a"
            done < <(asset_names "$ZIP_NAME" "$ZIP_PARTS")
            upload "$OUT_DIR/$ZIP_NAME.sha256"
          done < "$RELEASE_LIST"

          gh release view "$TAG" --repo "$STATIC_REPO" --json assets \
            -q '.assets[] | "\(.name) \(.size)"' > "$RUNNER_TEMP/assets.txt"

          BASE="https://github.com/$STATIC_REPO/releases/download/$TAG"
          echo "### UN1CA" >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r ZIP_NAME ZIP_SIZE ZIP_SHA256 ZIP_INC ZIP_PARTS; do
            while IFS= read -r name; do
              want="$(stat -c %s "$OUT_DIR/$name")"
              have="$(awk -v n="$name" '$1 == n { print $2 }' "$RUNNER_TEMP/assets.txt")"
              if [ "$have" != "$want" ]; then
                echo "Error: $name on release has size '${have:-missing}', expected $want" >&2
                exit 1
              fi
            done < <(asset_names "$ZIP_NAME" "$ZIP_PARTS")
            FIRST="$(asset_names "$ZIP_NAME" "$ZIP_PARTS" | head -n 1)"
            {
              if [ "$ZIP_PARTS" -eq 0 ]; then
                echo "- \`$ZIP_NAME\` (single file, incremental=$ZIP_INC)"
              else
                echo "- \`$ZIP_NAME\` ($ZIP_PARTS parts, incremental=$ZIP_INC)"
              fi
              echo "  - **SHA256**: \`$ZIP_SHA256\`"
              echo "  - **Download**: $BASE/$FIRST"
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$RELEASE_LIST"

      # Simpan target_files build ini supaya rilis berikutnya bisa membuat zip INCREMENTAL darinya.
      # Hanya build yang persis sama dengan yang terpasang di HP yang bisa dipakai sebagai sumber,
      # jadi file ini harus asli dari build yang dirilis (membangun ulang commit lama tidak cukup).
      - name: Store target-files for future incremental zips
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.STATIC_RESOURCES_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_FILES_ZIP="$(find "$OUT_DIR" -maxdepth 1 -name "${{ matrix.target }}_*-target_files.zip" | head -n 1)"
          CUR_NAME="$(basename "$TARGET_FILES_ZIP")"

          if ! gh release view "$TF_TAG" --repo "$STATIC_REPO" >/dev/null 2>&1; then
            gh release create "$TF_TAG" --repo "$STATIC_REPO" \
              --title "target-files (internal)" \
              --notes "Source files for building incremental zips. Not meant to be flashed." \
              || gh release view "$TF_TAG" --repo "$STATIC_REPO" >/dev/null
          fi

          split -b "$PART_SIZE" -d -a 2 "$TARGET_FILES_ZIP" "$TARGET_FILES_ZIP."
          for f in "$TARGET_FILES_ZIP".[0-9][0-9]; do
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "$TF_TAG" "$f" --repo "$STATIC_REPO" --clobber; then
                ok=1
                break
              fi
              echo "Upload of $(basename "$f") failed (attempt $attempt/3)" >&2
              sleep 15
            done
            if [ "$ok" -ne 1 ]; then
              echo "Error: could not upload $(basename "$f")" >&2
              exit 1
            fi
          done

          # Keep only the newest $TF_KEEP builds of this target; delete older parts.
          gh release view "$TF_TAG" --repo "$STATIC_REPO" --json assets \
            -q '.assets[] | "\(.createdAt) \(.name)"' \
            | grep -E " ${{ matrix.target }}_.*-target_files\.zip\.[0-9]{2}$" \
            | sort -r \
            | awk -v keep="$TF_KEEP" '{ n=$2; sub(/\.[0-9][0-9]$/, "", n); if (!seen[n]++) order[++c]=n; names[n]=names[n] " " $2 }
                   END { for (i = keep + 1; i <= c; i++) print names[order[i]] }' \
            | tr ' ' '\n' | grep -v '^$' > "$RUNNER_TEMP/prune.txt" || true
          while IFS= read -r a; do
            echo "Pruning old target-files asset $a"
            gh release delete-asset "$TF_TAG" "$a" --repo "$STATIC_REPO" --yes || true
          done < "$RUNNER_TEMP/prune.txt"

      - name: Update manifest in static_resources
        if: github.event_name != 'pull_request'
        env:
          GH_PAT: ${{ secrets.STATIC_RESOURCES_TOKEN }}
          CHANGELOG_INPUT: ${{ inputs.changelog }}
          SECURITY_PATCH_INPUT: ${{ inputs.security_patch }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_PAT}@github.com/${STATIC_REPO}.git" sr
          cd sr
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Both matrix jobs write the same manifest.json, so always start from the latest
          # remote state and retry if the push is rejected.
          for attempt in 1 2 3 4 5 6; do
            if git fetch origin "$MANIFEST_BRANCH" 2>/dev/null; then
              git checkout -q -B "$MANIFEST_BRANCH" "origin/$MANIFEST_BRANCH"
            else
              git checkout -q -B "$MANIFEST_BRANCH"
            fi
            mkdir -p updates
            python3 - <<'PY'
          import json, os
          e = os.environ
          p = "updates/manifest.json"
          data = json.load(open(p)) if os.path.exists(p) else {"response": []}
          for line in open(e["RELEASE_LIST"]):
              line = line.rstrip("\n")
              if not line:
                  continue
              name, size, sha, inc, parts = line.split("|")
              size, parts = int(size), int(parts)
              base = "https://github.com/%s/releases/download/%s/%s" % (
                  e["STATIC_REPO"], e["RELEASE_TAG"], name)
              # single file: plain name (like official UN1CA); split zip: .00, .01, ...
              urls = [base] if parts == 0 else ["%s.%02d" % (base, i) for i in range(parts)]
              entry = {
                  "datetime": int(e["ROM_BUILD_TIMESTAMP"]),
                  "device": e["TARGET_CODENAME"],
                  "filename": name,
                  "id": sha,
                  "patch": e["SECURITY_PATCH_INPUT"],
                  "size": size,
                  "urls": urls,
                  "version": e["ROM_VERSION"],
                  # 0 = full zip; otherwise the build timestamp this zip updates FROM
                  "incremental": int(inc),
              }
              if not any(x["id"] == entry["id"] for x in data["response"]):
                  data["response"].append(entry)
          json.dump(data, open(p, "w"), separators=(",", ":"))
          PY
            if [ -n "$CHANGELOG_INPUT" ]; then
              {
                echo "UN1CA ${ROM_VERSION}"
                echo
                printf '%s\n' "$CHANGELOG_INPUT" | sed 's/ \/ /\n/g'
              } > "updates/${ROM_VERSION}.txt"
            else
              if [ ! -f "updates/${ROM_VERSION}.txt" ]; then
                echo "UN1CA ${ROM_VERSION}" \
                  > "updates/${ROM_VERSION}.txt"
              fi
            fi

            echo "============================================="
            echo "Changelog:"
            echo "============================================="
            cat "updates/${ROM_VERSION}.txt"
            echo "============================================="

            git add updates
            if git diff --cached --quiet; then
              echo "Manifest already up to date"
              exit 0
            fi
            git commit -q -m "Add ${ROM_VERSION} (${TARGET_CODENAME})"
            if git push origin "$MANIFEST_BRANCH"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/6), retrying..." >&2
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "Error: could not push manifest after 6 attempts" >&2
          exit 1
